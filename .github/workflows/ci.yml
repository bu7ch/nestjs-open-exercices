name: Tests

on: [push, pull_request]

jobs:
  # Ton travail : les tests des exercices sur ton code (dans src/).
  # Il est normal qu'ils échouent tant que tu n'as pas fini les exercices.
  exercices:
    runs-on: ubuntu-latest
    continue-on-error: true
    # À partir de la partie 5, les tests ont besoin de PostgreSQL : la base de test marketplace_test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # À partir de la partie 10, les tests ont aussi besoin de Redis (les compteurs du throttler, /sante/pret).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: marketplace
      DB_PASSWORD: marketplace
      DB_NAME: marketplace_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Garde-fou du cours : chaque solution du dossier solutions/ doit passer les tests de sa partie.
  solutions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # À partir de la partie 10, les tests ont aussi besoin de Redis (les compteurs du throttler, /sante/pret).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: marketplace
      DB_PASSWORD: marketplace
      DB_NAME: marketplace_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verifier:solutions
